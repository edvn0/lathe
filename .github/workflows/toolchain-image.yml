name: toolchain image

# Publishes the build container (Dockerfile) to GitHub Container Registry, tagged with the Dockerfile's hash, and
# returns its reference. ci and perf call this, then run their jobs inside the image (`container:`), so each job
# pulls a finished image instead of re-exporting it from the build cache and loading it into the runner's Docker.
#
# The image is only built when its tag is missing: the first run after a Dockerfile change, including on the PR that
# changes it. Fork PRs can't push (their GITHUB_TOKEN is read-only), so a fork PR that changes the Dockerfile fails
# here until a maintainer's run publishes the image.

on:
  workflow_call:
    outputs:
      image:
        description: The image reference, e.g. ghcr.io/<owner>/cross-build:<dockerfile hash>.
        value: ${{ jobs.publish.outputs.image }}

jobs:
  publish:
    name: publish
    runs-on: [self-hosted, linux]

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry paths must be lowercase.
      - name: Image reference
        id: reference
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/cross-build:${{ hashFiles('Dockerfile') }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a published image
        id: published
        shell: bash
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE} is already published."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE} is not published yet; building it."
          fi

      - name: Set up Docker Buildx
        if: steps.published.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.reference.outputs.image }}
          # Links the package to this repository, so it inherits the repository's access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
