name: shaders

# Compiles every shader entry point the way the engine does at startup (Slang -O3, then spirv-opt's performance passes)
# and validates the result. The ci workflow's build only compiles a few shaders with slangc, for push-constant
# reflection, so an optimizer crash on a shader was first seen as a segfault at startup. See tools/check_shaders.py.
#
# Its own workflow so it runs on its own inputs: a shader, the script, its image, or a version it pins. It needs no
# C++ build, and ci's filter ignores these files in turn (except the shaders themselves, which the build reflects).
#
# The workflow itself always triggers, and the `changes` job decides whether the jobs run. A `paths:` filter on the
# trigger would leave the required "shaders / slangc -O3 + spirv-opt" check unreported ("Expected") on every PR that
# touches none of these files, blocking the merge; a job skipped by `if:` reports as skipped, which satisfies it.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shaders: ${{ steps.filter.outputs.shaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shaders:
              - "assets/shaders/**"
              - "tools/check_shaders.py"
              - "docker/shader-check/**"
              # The versions the tools must match: SLANG_VERSION and SPIRV_TOOLS_TAG.
              - "CMakeLists.txt"
              - "Dockerfile"
              - ".github/workflows/shaders.yml"
              - ".github/workflows/toolchain-image.yml"

  # Just slangc, spirv-opt and spirv-val: no compiler toolchain, so a much smaller image than the build's.
  shader-toolchain:
    name: shader check image
    needs: changes
    if: needs.changes.outputs.shaders == 'true'
    uses: ./.github/workflows/toolchain-image.yml
    with:
      dockerfile: docker/shader-check/Dockerfile
      context: docker/shader-check
      image: shader-check
    permissions:
      contents: read
      packages: write

  shaders:
    name: shaders / slangc -O3 + spirv-opt

    needs: [changes, shader-toolchain]
    if: needs.changes.outputs.shaders == 'true'
    runs-on: ubuntu-latest

    container:
      image: ${{ needs.shader-toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The check is only meaningful with the tools the build uses: the Slang release from CMakeLists.txt and the
      # SPIRV-Tools tag from the build Dockerfile. Bumping either means bumping docker/shader-check/Dockerfile too.
      - name: Tool versions match the build
        run: |
          set -euo pipefail

          want_slang="$(grep -A1 -E '^[[:space:]]+SLANG_VERSION[[:space:]]*$' CMakeLists.txt | sed -n 2p | tr -d ' "')"
          have_slang="$(slangc -v 2>&1 | tail -n 1)"
          want_spirv_tools="$(sed -n 's/^ARG SPIRV_TOOLS_TAG=//p' Dockerfile)"
          have_spirv_tools="$(spirv-opt --version 2>&1)"

          echo "Slang: want ${want_slang}, have ${have_slang}"
          echo "SPIRV-Tools: want ${want_spirv_tools}, have ${have_spirv_tools}"

          if [[ -z "${want_slang}" || "${have_slang}" != "${want_slang}" ]]; then
            echo "::error::slangc ${have_slang} does not match SLANG_VERSION ${want_slang} in CMakeLists.txt; update docker/shader-check/Dockerfile"
            exit 1
          fi

          if [[ -z "${want_spirv_tools}" || "${have_spirv_tools}" != *"${want_spirv_tools}"* ]]; then
            echo "::error::spirv-opt (${have_spirv_tools}) does not match SPIRV_TOOLS_TAG ${want_spirv_tools} in Dockerfile; update docker/shader-check/Dockerfile"
            exit 1
          fi

      - name: Check shaders
        run: python3 tools/check_shaders.py

      # The container runs as root; hand the workspace back to the runner's user, as the build jobs do.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"
