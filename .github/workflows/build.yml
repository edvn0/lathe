name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  toolchain:
    name: toolchain image
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  build:
    name: ${{ matrix.target }} / ${{ matrix.build_type }}

    needs: toolchain
    runs-on: ubuntu-latest

    # Every step runs inside the toolchain image, pulled once per job.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        # Only linux-native is built in CI.
        target:
          - linux-native
        build_type:
          - Debug
          - RelWithDebInfo

    defaults:
      run:
        shell: bash

    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Caches live under $HOME, which is also where actions/cache resolves `~` inside the container.
      - name: Set up environment
        run: |
          set -euo pipefail

          {
            echo "CPM_SOURCE_CACHE=${HOME}/.cache/CPM"
            echo "CCACHE_DIR=${HOME}/.cache/ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

          # The workspace is owned by the runner's user, not the container's root, so git would refuse it.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # One key for every job: the fetched sources don't depend on the configuration. Jobs finishing after the first
      # to save just skip saving.
      #
      # v2 in every cache key: actions/cache stores paths relative to the workspace, and inside the container both the
      # workspace and $HOME moved, so archives saved by the old docker-run jobs would unpack to the wrong place.
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-v2-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}
          restore-keys: |
            cpm-v2-

      # Separate caches per target and configuration. ccache hashes compiler options, so restoring another
      # configuration's cache only costs misses. The run id makes every run save: actions/cache never overwrites an
      # existing key, so a key without it would freeze the cache until the CMake files next change. CCACHE_MAXSIZE
      # bounds what that accumulates.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-v2-${{ matrix.target }}-${{ matrix.build_type }}-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}-${{ github.run_id }}
          restore-keys: |
            ccache-v2-${{ matrix.target }}-${{ matrix.build_type }}-${{ hashFiles('Dockerfile', 'cmake/toolchains/**', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-v2-${{ matrix.target }}-${{ matrix.build_type }}-
            ccache-v2-${{ matrix.target }}-

      # The shader reflection tool (tools/shader_reflect) otherwise downloads and compiles its crates, including
      # SPIRV-Cross, in every job. The registry is the image's CARGO_HOME registry; the target directory lives in the
      # build tree, so the key is per job.
      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            build/*/generated/cargo
          key: >-
            cargo-v2-${{ matrix.target }}-${{ matrix.build_type }}-${{
              hashFiles('Dockerfile', 'tools/shader_reflect/**')
            }}
          restore-keys: |
            cargo-v2-${{ matrix.target }}-${{ matrix.build_type }}-

      # Content-addressed (see tools/clang_tidy_cached.py), so one shared key prefix is safe; the run id makes every
      # run save its new entries. run_clang_tidy.sh defaults to ~/.cache/clang-tidy.
      - name: Restore clang-tidy cache
        if: matrix.build_type == 'Debug'
        uses: actions/cache@v4
        with:
          path: ~/.cache/clang-tidy
          key: clang-tidy-v2-${{ github.run_id }}
          restore-keys: |
            clang-tidy-v2-

      - name: Configure
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_dir="build/${target}-${build_type,,}"

          # mold links the executables in seconds.
          linker_args=()
          if [[ "${target}" == "linux-native" ]]; then
            linker_args+=(-DCMAKE_LINKER_TYPE=MOLD)
          fi

          cmake \
            -S . \
            -B "${build_dir}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${build_type}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${linker_args[@]}"

      - name: Reset ccache statistics
        run: ccache --zero-stats

      # mingw-vulkan-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          cmake \
            --build "build/${{ matrix.target }}-${build_type,,}" \
            --parallel \
            --target all mingw-vulkan-tests

      - name: Test
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          ctest \
            --test-dir "build/${{ matrix.target }}-${build_type,,}" \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error

      # Reuses this job's compile database and generated headers, so it runs after the build.
      - name: clang-tidy
        if: matrix.build_type == 'Debug'
        run: tools/run_clang_tidy.sh "build/${{ matrix.target }}-debug"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  sanitize:
    name: linux-native / Debug / ASan+UBSan / -Werror

    needs: toolchain
    runs-on: ubuntu-latest

    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          set -euo pipefail

          {
            echo "CPM_SOURCE_CACHE=${HOME}/.cache/CPM"
            echo "CCACHE_DIR=${HOME}/.cache/ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-v2-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}
          restore-keys: |
            cpm-v2-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-v2-sanitize-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}-${{ github.run_id }}
          restore-keys: |
            ccache-v2-sanitize-${{ hashFiles('Dockerfile', 'cmake/toolchains/**', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-v2-sanitize-

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            build/*/generated/cargo
          key: >-
            cargo-v2-sanitize-${{
              hashFiles('Dockerfile', 'tools/shader_reflect/**')
            }}
          restore-keys: |
            cargo-v2-sanitize-

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/linux-native-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMINGW_VULKAN_SANITIZE=ON \
            -DMINGW_VULKAN_WERROR=ON \
            -DCMAKE_LINKER_TYPE=MOLD

      # mingw-vulkan-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          cmake \
            --build build/linux-native-debug \
            --parallel \
            --target all mingw-vulkan-tests

      # Sanitizer errors abort with a nonzero exit, which ctest reports as a failure.
      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build/linux-native-debug \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error
