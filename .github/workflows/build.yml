name: ci

# Skipped for commits that touch no source or build input (docs, etc.). If ci becomes a required status check, a skipped
# workflow leaves it pending; switch to a paths-filter job in that case.
on:
  push:
    branches:
      - main
    paths: &paths
      - "**.cxx"
      - "**.hxx"
      - "**.slang"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker/**"
      - "tools/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/toolchain-image.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read
  packages: read

jobs:
  toolchain:
    name: toolchain image
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  build:
    name: ${{ matrix.target }} / ${{ matrix.build_type }}

    needs: toolchain
    runs-on: ubuntu-latest

    # Every step runs inside the toolchain image, pulled once per job.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-native
        build_type:
          - Debug
          - RelWithDebInfo

    defaults:
      run:
        shell: bash

    # One ccache on the cache volume serves every job and configuration: ccache hashes compiler options, so they
    # don't collide, and CCACHE_MAXSIZE bounds the total.
    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub-hosted runners are fresh VMs, so nothing persists between jobs: the caches round-trip through
      # actions/cache. A run restores the newest ccache visible to it: its own branch's, else its base branch's, else
      # main's. Every run saves its ccache, so a PR's later pushes start from its own previous build instead of main's.
      # Dependency caches are saved by main only. ccache is per configuration; CPM sources and cargo outputs are shared
      # by every job.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: |
            /ci-cache/ccache
          key: ccache-v3-${{ matrix.target }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v3-${{ matrix.target }}-${{ matrix.build_type }}-

      - name: Restore dependency caches
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            /ci-cache/cpm
            /ci-cache/cargo-target
            /opt/cargo/registry
          key: deps-v3-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tools/shader_reflect/**') }}

      - name: Set up environment
        run: |
          set -euo pipefail

          # The workspace is owned by the runner's user, not the container's root, so git would refuse it.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          tools/ci_cache.sh env
          cargo_target_dir="$(tools/ci_cache.sh cargo-target-dir HEAD)"
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "SHADER_REFLECT_CARGO_TARGET_DIR=${cargo_target_dir}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_dir="build/${target}-${build_type,,}"

          # mold links the executables in seconds.
          linker_args=()
          if [[ "${target}" == "linux-native" ]]; then
            linker_args+=(-DCMAKE_LINKER_TYPE=MOLD)
          fi

          cmake \
            -S . \
            -B "${build_dir}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${build_type}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLATHE_CARGO_TARGET_DIR="${SHADER_REFLECT_CARGO_TARGET_DIR}" \
            "${linker_args[@]}"

      - name: Reset ccache statistics
        run: ccache --zero-stats

      # lathe-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          cmake \
            --build "build/${{ matrix.target }}-${build_type,,}" \
            --parallel \
            --target all lathe-tests

      - name: Test
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          ctest \
            --test-dir "build/${{ matrix.target }}-${build_type,,}" \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error

      # Every shader entry point through the pipeline the engine runs at startup (Slang -O3, spirv-opt, spirv-val), with
      # the build's own Slang. The build only compiles a few shaders for push-constant reflection, so an optimizer crash
      # on a shader was first seen as a segfault at startup. See tools/check_shaders.py. Once is enough: the shaders and
      # tools don't depend on the build type.
      - name: Check shaders
        if: matrix.build_type == 'Debug'
        run: |
          set -euo pipefail

          build_dir="build/${{ matrix.target }}-debug"
          slang_root="$(sed -n 's/^LATHE_SLANG_ROOT:INTERNAL=//p' "${build_dir}/CMakeCache.txt")"

          python3 tools/check_shaders.py --slangc "${slang_root}/bin/slangc"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            /ci-cache/ccache
          key: ccache-v3-${{ matrix.target }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Save dependency caches
        if: always() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /ci-cache/cpm
            /ci-cache/cargo-target
            /opt/cargo/registry
          key: deps-v3-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tools/shader_reflect/**') }}

      # The container runs as root, so everything it wrote into the shared workspace is root-owned. Hand it back to the
      # runner's user, or the next job that runs on the host (e.g. the toolchain image publish) can't clean it.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"

  sanitize:
    name: linux-native / Debug / ASan+UBSan / -Werror

    needs: toolchain
    runs-on: ubuntu-latest

    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub-hosted runners are fresh VMs, so nothing persists between jobs: the caches round-trip through
      # actions/cache. A run restores the newest ccache visible to it: its own branch's, else its base branch's, else
      # main's. Every run saves its ccache, so a PR's later pushes start from its own previous build instead of main's.
      # Dependency caches are saved by main only. ccache is per configuration; CPM sources and cargo outputs are shared
      # by every job.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: |
            /ci-cache/ccache
          key: ccache-v3-sanitize-${{ github.sha }}
          restore-keys: |
            ccache-v3-sanitize-

      - name: Restore dependency caches
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            /ci-cache/cpm
            /ci-cache/cargo-target
            /opt/cargo/registry
          key: deps-v3-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tools/shader_reflect/**') }}

      - name: Set up environment
        run: |
          set -euo pipefail

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          tools/ci_cache.sh env
          cargo_target_dir="$(tools/ci_cache.sh cargo-target-dir HEAD)"
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "SHADER_REFLECT_CARGO_TARGET_DIR=${cargo_target_dir}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/linux-native-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLATHE_SANITIZE=ON \
            -DLATHE_WERROR=ON \
            -DLATHE_CARGO_TARGET_DIR="${SHADER_REFLECT_CARGO_TARGET_DIR}" \
            -DCMAKE_LINKER_TYPE=MOLD

      # lathe-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          cmake \
            --build build/linux-native-debug \
            --parallel \
            --target all lathe-tests

      # Sanitizer errors abort with a nonzero exit, which ctest reports as a failure.
      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build/linux-native-debug \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            /ci-cache/ccache
          key: ccache-v3-sanitize-${{ github.sha }}

      - name: Save dependency caches
        if: always() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /ci-cache/cpm
            /ci-cache/cargo-target
            /opt/cargo/registry
          key: deps-v3-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tools/shader_reflect/**') }}

      # The container runs as root, so everything it wrote into the shared workspace is root-owned. Hand it back to the
      # runner's user, or the next job that runs on the host (e.g. the toolchain image publish) can't clean it.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"
