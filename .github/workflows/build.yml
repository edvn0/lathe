name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.build_type }}

    runs-on: [self-hosted, linux]

    strategy:
      fail-fast: false
      matrix:
        # Only linux-native is built in CI.
        target:
          - linux-native
        build_type:
          - Debug
          - RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: cross-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      # One key for every job: the fetched sources don't depend on the configuration, and per-job keys stored the
      # same ~1.3 GB once per job. Jobs finishing after the first to save just skip saving.
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}
          restore-keys: |
            cpm-

      # Separate caches per target and configuration. ccache hashes compiler options, so restoring another
      # configuration's cache only costs misses. The run id makes every run save: actions/cache never overwrites an
      # existing key, so a key without it would freeze the cache until the CMake files next change. CCACHE_MAXSIZE
      # bounds what that accumulates.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-${{ hashFiles('Dockerfile', 'cmake/toolchains/**', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-
            ccache-${{ matrix.target }}-

      # The shader reflection tool (tools/shader_reflect) otherwise downloads and compiles its crates, including
      # SPIRV-Cross, in every job. The registry is mounted over the image's CARGO_HOME registry; the target
      # directory lives in the build tree, so the key is per job.
      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-registry
            build/*/generated/cargo
          key: >-
            cargo-${{ matrix.target }}-${{ matrix.build_type }}-${{
              hashFiles('Dockerfile', 'tools/shader_reflect/**')
            }}
          restore-keys: |
            cargo-${{ matrix.target }}-${{ matrix.build_type }}-

      # Content-addressed (see tools/clang_tidy_cached.py), so one shared key prefix is safe; the run id makes every
      # run save its new entries.
      - name: Restore clang-tidy cache
        if: matrix.build_type == 'Debug'
        uses: actions/cache@v4
        with:
          path: ~/.cache/clang-tidy
          key: clang-tidy-${{ github.run_id }}
          restore-keys: |
            clang-tidy-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          mkdir -p "${HOME}/.cache/CPM"
          mkdir -p "${HOME}/.cache/ccache"

          # mold links the Debug executable in seconds; the default ld took ~1 minute.
          linker_args=()
          if [[ "${target}" == "linux-native" ]]; then
            linker_args+=(-DCMAKE_LINKER_TYPE=MOLD)
          fi

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=500M \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              -S . \
              -B "${build_dir}" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE="${build_type}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "${linker_args[@]}"

      - name: Reset ccache statistics
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CCACHE_DIR=/ccache \
            cross-build:latest \
            ccache --zero-stats

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          mkdir -p "${HOME}/.cache/cargo-registry"

          # mingw-vulkan-tests is EXCLUDE_FROM_ALL, so build it explicitly.
          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --mount type=bind,source="${HOME}/.cache/cargo-registry",target=/opt/cargo/registry \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=500M \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              --build "${build_dir}" \
              --parallel \
              --target all mingw-vulkan-tests

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --workdir /workspace \
            cross-build:latest \
            ctest \
              --test-dir "${build_dir}" \
              --output-on-failure \
              --parallel 4 \
              --no-tests=error

      # Reuses this job's compile database and generated headers, so it runs after the build.
      - name: clang-tidy
        if: matrix.build_type == 'Debug'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/clang-tidy"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/clang-tidy",target=/clang-tidy-cache \
            --env CLANG_TIDY_CACHE_DIR=/clang-tidy-cache \
            --workdir /workspace \
            cross-build:latest \
            tools/run_clang_tidy.sh build/${{ matrix.target }}-debug

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          docker run --rm \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CCACHE_DIR=/ccache \
            cross-build:latest \
            ccache --show-stats

  sanitize:
    name: linux-native / Debug / ASan+UBSan / -Werror

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: cross-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}
          restore-keys: |
            cpm-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-sanitize-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}-${{ github.run_id }}
          restore-keys: |
            ccache-sanitize-${{ hashFiles('Dockerfile', 'cmake/toolchains/**', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-sanitize-

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-registry
            build/*/generated/cargo
          key: >-
            cargo-sanitize-${{
              hashFiles('Dockerfile', 'tools/shader_reflect/**')
            }}
          restore-keys: |
            cargo-sanitize-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/CPM"
          mkdir -p "${HOME}/.cache/ccache"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=500M \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              -S . \
              -B build/linux-native-debug \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DMINGW_VULKAN_SANITIZE=ON \
              -DMINGW_VULKAN_WERROR=ON \
              -DCMAKE_LINKER_TYPE=MOLD

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/cargo-registry"

          # mingw-vulkan-tests is EXCLUDE_FROM_ALL, so build it explicitly.
          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --mount type=bind,source="${HOME}/.cache/cargo-registry",target=/opt/cargo/registry \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=500M \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              --build build/linux-native-debug \
              --parallel \
              --target all mingw-vulkan-tests

      # Sanitizer errors abort with a nonzero exit, which ctest reports as a failure.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --env ASAN_OPTIONS=halt_on_error=1:abort_on_error=1 \
            --env UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            --workdir /workspace \
            cross-build:latest \
            ctest \
              --test-dir build/linux-native-debug \
              --output-on-failure \
              --parallel 4 \
              --no-tests=error
