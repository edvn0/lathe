name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.build_type }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-native
          - windows-mingw
        build_type:
          - Debug
          - RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: cross-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      #
      # CPM_SOURCE_CACHE contains dependency source trees, not build products.
      #
      # Each matrix job gets its own immutable Actions cache key so parallel
      # jobs do not race when saving. The broad restore prefix means a cache
      # generated by any target/configuration can seed every other one.
      #
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}-${{ matrix.target }}-${{ matrix.build_type }}
          restore-keys: |
            cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            cpm-

      #
      # Keep native and MinGW compiler caches logically separate. Debug and
      # RelWithDebInfo have separate primary keys so parallel jobs can both
      # save their results, but may restore each other's target cache.
      #
      # ccache hashes compiler options, so restoring objects produced with
      # another build configuration is safe -- mismatching command lines are
      # simply cache misses.
      #
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-
            ccache-${{ matrix.target }}-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          mkdir -p "${HOME}/.cache/CPM"
          mkdir -p "${HOME}/.cache/ccache"

          toolchain_args=()

          if [[ "${target}" == "windows-mingw" ]]; then
            toolchain_args=(
              --toolchain
              /workspace/cmake/toolchains/windows-mingw-x64.cmake
            )
          fi

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=2G \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              -S . \
              -B "${build_dir}" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE="${build_type}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "${toolchain_args[@]}"

      - name: Reset ccache statistics
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CCACHE_DIR=/ccache \
            cross-build:latest \
            ccache --zero-stats

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=2G \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              --build "${build_dir}" \
              --parallel

      - name: Test
        if: matrix.target == 'linux-native'
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_type_lower="${build_type,,}"
          build_dir="build/${target}-${build_type_lower}"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --workdir /workspace \
            cross-build:latest \
            ctest \
              --test-dir "${build_dir}" \
              --output-on-failure \
              --parallel 4 \
              --no-tests=error

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          docker run --rm \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CCACHE_DIR=/ccache \
            cross-build:latest \
            ccache --show-stats

  sanitize:
    name: linux-native / Debug / ASan+UBSan / -Werror

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: cross-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}-sanitize
          restore-keys: |
            cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            cpm-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-sanitize-${{
              hashFiles(
                'Dockerfile',
                'cmake/toolchains/**',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}
          restore-keys: |
            ccache-sanitize-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/CPM"
          mkdir -p "${HOME}/.cache/ccache"

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=2G \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              -S . \
              -B build/linux-native-debug \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DMINGW_VULKAN_SANITIZE=ON \
              -DMINGW_VULKAN_WERROR=ON

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --mount type=bind,source="${HOME}/.cache/CPM",target=/cpm-cache \
            --mount type=bind,source="${HOME}/.cache/ccache",target=/ccache \
            --env CPM_SOURCE_CACHE=/cpm-cache \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_NOHASHDIR=true \
            --env CCACHE_COMPILERCHECK=content \
            --env CCACHE_MAXSIZE=2G \
            --workdir /workspace \
            cross-build:latest \
            cmake \
              --build build/linux-native-debug \
              --parallel

      # ASan/UBSan errors abort the process with a nonzero exit code, which
      # ctest already treats as a test failure -- no extra flag needed beyond
      # making the sanitizers fail loudly instead of just logging.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --mount type=bind,source="${PWD}",target=/workspace \
            --env ASAN_OPTIONS=halt_on_error=1:abort_on_error=1 \
            --env UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            --workdir /workspace \
            cross-build:latest \
            ctest \
              --test-dir build/linux-native-debug \
              --output-on-failure \
              --parallel 4 \
              --no-tests=error
