name: ci

# Skipped for commits that touch no source or build input (docs, etc.). If ci becomes a required status check, a skipped
# workflow leaves it pending; switch to a paths-filter job in that case.
on:
  push:
    branches:
      - main
    paths: &paths
      - "**.cxx"
      - "**.hxx"
      - "**.slang"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker/**"
      - "tools/**"
      - ".clang-tidy"
      - ".github/workflows/**"
  pull_request:
    paths: *paths

permissions:
  contents: read
  packages: read

jobs:
  toolchain:
    name: toolchain image
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  # Just slangc, spirv-opt and spirv-val, for the shaders job below: it needs no compiler toolchain, so it runs in a
  # much smaller image than the build's.
  shader-toolchain:
    name: shader check image
    uses: ./.github/workflows/toolchain-image.yml
    with:
      dockerfile: docker/shader-check/Dockerfile
      context: docker/shader-check
      image: shader-check
    permissions:
      contents: read
      packages: write

  # Compiles every shader entry point the way the engine does at startup (Slang -O3, then spirv-opt's performance
  # passes) and validates the result. The build jobs only compile a few shaders with slangc, for push-constant
  # reflection, so an optimizer crash on a shader was first seen as a segfault at startup. See tools/check_shaders.py.
  shaders:
    name: shaders / slangc -O3 + spirv-opt

    needs: shader-toolchain
    runs-on: [self-hosted, linux]

    container:
      image: ${{ needs.shader-toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The check is only meaningful with the tools the build uses: the Slang release from CMakeLists.txt and the
      # SPIRV-Tools tag from the build Dockerfile. Bumping either means bumping docker/shader-check/Dockerfile too.
      - name: Tool versions match the build
        run: |
          set -euo pipefail

          want_slang="$(grep -A1 -E '^[[:space:]]+SLANG_VERSION[[:space:]]*$' CMakeLists.txt | sed -n 2p | tr -d ' "')"
          have_slang="$(slangc -v 2>&1 | tail -n 1)"
          want_spirv_tools="$(sed -n 's/^ARG SPIRV_TOOLS_TAG=//p' Dockerfile)"
          have_spirv_tools="$(spirv-opt --version 2>&1)"

          echo "Slang: want ${want_slang}, have ${have_slang}"
          echo "SPIRV-Tools: want ${want_spirv_tools}, have ${have_spirv_tools}"

          if [[ -z "${want_slang}" || "${have_slang}" != "${want_slang}" ]]; then
            echo "::error::slangc ${have_slang} does not match SLANG_VERSION ${want_slang} in CMakeLists.txt; update docker/shader-check/Dockerfile"
            exit 1
          fi

          if [[ -z "${want_spirv_tools}" || "${have_spirv_tools}" != *"${want_spirv_tools}"* ]]; then
            echo "::error::spirv-opt (${have_spirv_tools}) does not match SPIRV_TOOLS_TAG ${want_spirv_tools} in Dockerfile; update docker/shader-check/Dockerfile"
            exit 1
          fi

      - name: Check shaders
        run: python3 tools/check_shaders.py

      # The container runs as root; hand the workspace back to the runner's user, as the build jobs do.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"

  build:
    name: ${{ matrix.target }} / ${{ matrix.build_type }}

    needs: toolchain
    runs-on: [self-hosted, linux]

    # Every step runs inside the toolchain image, pulled once per job.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Build caches that persist on the runner; see tools/ci_cache.sh. The cargo registry keeps the image's path.
      volumes:
        - lathe-ci-cache:/ci-cache
        - lathe-cargo-registry:/opt/cargo/registry

    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-native
        build_type:
          - Debug
          - RelWithDebInfo

    defaults:
      run:
        shell: bash

    # One ccache on the cache volume serves every job and configuration: ccache hashes compiler options, so they
    # don't collide, and CCACHE_MAXSIZE bounds the total.
    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        run: |
          set -euo pipefail

          # The workspace is owned by the runner's user, not the container's root, so git would refuse it.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          tools/ci_cache.sh env
          cargo_target_dir="$(tools/ci_cache.sh cargo-target-dir HEAD)"
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "SHADER_REFLECT_CARGO_TARGET_DIR=${cargo_target_dir}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          build_type="${{ matrix.build_type }}"
          build_dir="build/${target}-${build_type,,}"

          # mold links the executables in seconds.
          linker_args=()
          if [[ "${target}" == "linux-native" ]]; then
            linker_args+=(-DCMAKE_LINKER_TYPE=MOLD)
          fi

          cmake \
            -S . \
            -B "${build_dir}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${build_type}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLATHE_CARGO_TARGET_DIR="${SHADER_REFLECT_CARGO_TARGET_DIR}" \
            "${linker_args[@]}"

      - name: Reset ccache statistics
        run: ccache --zero-stats

      # lathe-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          cmake \
            --build "build/${{ matrix.target }}-${build_type,,}" \
            --parallel \
            --target all lathe-tests

      - name: Test
        run: |
          set -euo pipefail

          build_type="${{ matrix.build_type }}"

          ctest \
            --test-dir "build/${{ matrix.target }}-${build_type,,}" \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error

      # Reuses this job's compile database and generated headers, so it runs after the build.
      - name: clang-tidy
        if: matrix.build_type == 'Debug'
        run: tools/run_clang_tidy.sh "build/${{ matrix.target }}-debug"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # The container runs as root, so everything it wrote into the shared workspace is root-owned. Hand it back to the
      # runner's user, or the next job that runs on the host (e.g. the toolchain image publish) can't clean it.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"

  sanitize:
    name: linux-native / Debug / ASan+UBSan / -Werror

    needs: toolchain
    runs-on: [self-hosted, linux]

    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Build caches that persist on the runner; see tools/ci_cache.sh. The cargo registry keeps the image's path.
      volumes:
        - lathe-ci-cache:/ci-cache
        - lathe-cargo-registry:/opt/cargo/registry

    defaults:
      run:
        shell: bash

    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        run: |
          set -euo pipefail

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          tools/ci_cache.sh env
          cargo_target_dir="$(tools/ci_cache.sh cargo-target-dir HEAD)"
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "SHADER_REFLECT_CARGO_TARGET_DIR=${cargo_target_dir}"
          } >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/linux-native-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLATHE_SANITIZE=ON \
            -DLATHE_WERROR=ON \
            -DLATHE_CARGO_TARGET_DIR="${SHADER_REFLECT_CARGO_TARGET_DIR}" \
            -DCMAKE_LINKER_TYPE=MOLD

      # lathe-tests is EXCLUDE_FROM_ALL, so build it explicitly.
      - name: Build
        run: |
          cmake \
            --build build/linux-native-debug \
            --parallel \
            --target all lathe-tests

      # Sanitizer errors abort with a nonzero exit, which ctest reports as a failure.
      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir build/linux-native-debug \
            --output-on-failure \
            --parallel 4 \
            --no-tests=error

      # The container runs as root, so everything it wrote into the shared workspace is root-owned. Hand it back to the
      # runner's user, or the next job that runs on the host (e.g. the toolchain image publish) can't clean it.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"
