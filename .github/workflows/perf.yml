name: perf

# Benchmarks the PR against its base: both builds fly the same seeded scene
# along the game's benchmark camera loop (--benchmark, see
# include/app/benchmark.hxx), and tools/perf/compare_benchmarks.py turns the
# two JSON results into a per-stage table posted on the PR. The app runs
# headless (VK_EXT_headless_surface, no X server) and uses the best GPU the
# container can see; with none it renders with Mesa's lavapipe: reliable for
# large regressions, not a substitute for profiling on real hardware.
#
# To benchmark on a real GPU, set repository variables (Settings >
# Secrets and variables > Actions > Variables):
#   PERF_DOCKER_GPU_ARGS    extra `docker create` options for the job's
#                           container, e.g. `--device /dev/dri` for AMD or
#                           Intel (Mesa), or for NVIDIA with
#                           nvidia-container-toolkit:
#                             --gpus all --env NVIDIA_DRIVER_CAPABILITIES=all
#   PERF_BENCHMARK_ARGS     overrides BENCHMARK_ARGS below (a GPU runs the
#                           lap in seconds -- use more frames)
# See docs/perf-benchmark.md.

on:
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: toolchain image
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  benchmark:
    name: benchmark / base vs head

    needs: toolchain
    runs-on: [self-hosted, linux]
    timeout-minutes: 150

    # Every step runs inside the toolchain image, pulled once per job.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: ${{ vars.PERF_DOCKER_GPU_ARGS || '' }}

    defaults:
      run:
        shell: bash

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # One lap of 240 frames (16 per keyframe segment) after at least 30
      # warmup frames; lavapipe manages roughly a frame per second or two.
      BENCHMARK_ARGS: ${{ vars.PERF_BENCHMARK_ARGS || '--benchmark-frames=240 --benchmark-warmup=30 --seed=1337' }}
      BENCHMARK_TIMEOUT: "2700"
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Caches live under $HOME, which is also where actions/cache resolves `~` inside the container.
      - name: Set up environment
        run: |
          set -euo pipefail

          {
            echo "CPM_SOURCE_CACHE=${HOME}/.cache/CPM"
            echo "CCACHE_DIR=${HOME}/.cache/ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          } >> "${GITHUB_ENV}"

          # The workspace is owned by the runner's user, not the container's root, so git would refuse it.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # v2 in the cache keys: see the CPM cache step in build.yml.
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: >-
            cpm-v2-${{
              hashFiles('**/CMakeLists.txt', '**/*.cmake')
            }}
          restore-keys: |
            cpm-v2-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # The run id makes every run save; see the ccache step in build.yml.
          key: >-
            ccache-v2-perf-${{
              hashFiles(
                'Dockerfile',
                '**/CMakeLists.txt',
                '**/*.cmake'
              )
            }}-${{ github.run_id }}
          restore-keys: |
            ccache-v2-perf-${{ hashFiles('Dockerfile', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-v2-perf-
            ccache-v2-linux-native-RelWithDebInfo-

      # See the cargo step in build.yml. Covers both build/perf-head and build/perf-base.
      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            build/*/generated/cargo
          key: >-
            cargo-v2-perf-${{
              hashFiles('Dockerfile', 'tools/shader_reflect/**')
            }}
          restore-keys: |
            cargo-v2-perf-

      - name: Export base sources
        id: base
        run: |
          set -euo pipefail

          mkdir -p perf

          mkdir -p build/perf-base-src
          git archive "${BASE_SHA}" | tar -x -C build/perf-base-src

          if [[ -f build/perf-base-src/include/app/benchmark.hxx ]]; then
            echo "has_benchmark=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Base ${BASE_SHA} predates --benchmark; reporting head only."
            echo "has_benchmark=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        run: |
          set -euo pipefail

          build() {
            local source_dir="$1" build_dir="$2"

            cmake \
              -S "${source_dir}" \
              -B "${build_dir}" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_LINKER_TYPE=MOLD

            cmake --build "${build_dir}" --parallel --target mingw-vulkan
          }

          build . build/perf-head

          if [[ "${{ steps.base.outputs.has_benchmark }}" == "true" ]]; then
            build build/perf-base-src build/perf-base
          fi

      # Base first, then head, back to back on the same runner. The base
      # build is driven by head's run script, which only needs its binary.
      - name: Benchmark base
        if: steps.base.outputs.has_benchmark == 'true'
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086 # BENCHMARK_ARGS is a list of flags
          tools/perf/run_benchmark.sh build/perf-base perf/base.json ${BENCHMARK_ARGS}

      - name: Benchmark head
        run: |
          # shellcheck disable=SC2086 # BENCHMARK_ARGS is a list of flags
          tools/perf/run_benchmark.sh build/perf-head perf/head.json ${BENCHMARK_ARGS} --benchmark-screenshots

      - name: Compare
        id: compare
        run: |
          set -uo pipefail

          python3 tools/perf/compare_benchmarks.py \
            --base perf/base.json \
            --head perf/head.json \
            --markdown perf/report.md
          status=$?

          cat perf/report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

          # 1 is "regressed past the threshold" -- reported below, after the
          # comment is posted. Anything else is the script itself failing.
          if [[ ${status} -ne 0 && ${status} -ne 1 ]]; then
            exit "${status}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-benchmark
          path: |
            perf/
            build/perf-head/bin/screenshots/
          if-no-files-found: ignore

      # Read-only token on fork PRs: the report is still in the job summary.
      - name: Comment on PR
        if: steps.compare.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-benchmark -->';
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${fs.readFileSync('perf/report.md', 'utf8')}\n` +
                         `Raw results and keyframe screenshots: [workflow run](${run_url}) (artifact \`perf-benchmark\`).`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on regression
        if: steps.compare.outputs.status == '1'
        run: |
          echo "Full-frame median regressed past the threshold -- see the report above." >&2
          exit 1

      # The container runs as root, so everything it wrote into the shared workspace is root-owned. Hand it back to the
      # runner's user, or the next job that runs on the host (e.g. the toolchain image publish) can't clean it.
      - name: Return workspace ownership to the runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "${GITHUB_WORKSPACE}")" "${GITHUB_WORKSPACE}"
